<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alpha Kappa Psi — Mention Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --pos: #22c55e;
    --neu: #94a3b8;
    --neg: #ef4444;
    --new: #f59e0b;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #13233f, var(--bg));
  }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
  }
  #search {
    flex: 1 1 240px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: .95rem;
  }
  #search::placeholder { color: var(--muted); }
  select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: .9rem;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    font-size: .8rem;
    color: var(--muted);
  }
  .pill {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .pill b { color: var(--text); }

  .grid { display: grid; gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.new { border-color: var(--new); box-shadow: 0 0 0 1px var(--new) inset; }

  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card h2 { margin: 0 0 6px; font-size: 1.08rem; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  .summary { font-size: .92rem; color: #cbd5e1; margin: 0 0 10px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 700;
  }
  .badge.new { background: var(--new); color: #1a1200; }
  .s-positive { background: rgba(34,197,94,.15); color: var(--pos); border: 1px solid var(--pos); }
  .s-neutral  { background: rgba(148,163,184,.15); color: var(--neu); border: 1px solid var(--neu); }
  .s-negative { background: rgba(239,68,68,.15); color: var(--neg); border: 1px solid var(--neg); }
  .readmore { font-size: .82rem; color: var(--accent); text-decoration: none; }
  .readmore:hover { text-decoration: underline; }

  .empty, .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; padding: 24px; color: var(--muted); font-size: .8rem; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Alpha Kappa Psi — Mention Tracker</h1>
  <p>Automatically monitoring the web for mentions · free &amp; API-key-free</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search title, source, or summary…" />
    <select id="sentiment">
      <option value="all">All sentiment</option>
      <option value="positive">Positive</option>
      <option value="neutral">Neutral</option>
      <option value="negative">Negative</option>
    </select>
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="loading" id="loading">Loading mentions…</div>
</div>

<footer>
  Built with GitHub Actions + GitHub Pages · <span id="updated"></span>
</footer>

<script>
  // Resolve data path whether hosted at /dashboard/ or served from repo root.
  const DATA_CANDIDATES = ["../data/mentions.json", "data/mentions.json", "./mentions.json"];
  const RECENT_MS = 24 * 60 * 60 * 1000; // items in last 24h flagged "new"

  let all = [];
  const els = {
    grid: document.getElementById("grid"),
    loading: document.getElementById("loading"),
    stats: document.getElementById("stats"),
    updated: document.getElementById("updated"),
    search: document.getElementById("search"),
    sentiment: document.getElementById("sentiment"),
    sort: document.getElementById("sort"),
  };

  async function loadData() {
    for (const path of DATA_CANDIDATES) {
      try {
        const res = await fetch(path, { cache: "no-store" });
        if (res.ok) return await res.json();
      } catch (_) { /* try next */ }
    }
    throw new Error("mentions.json not found");
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function isNew(iso) {
    const d = new Date(iso);
    return !isNaN(d) && (Date.now() - d.getTime()) < RECENT_MS;
  }

  function render() {
    const q = els.search.value.trim().toLowerCase();
    const sFilter = els.sentiment.value;
    const sortDir = els.sort.value;

    let items = all.filter(m => {
      const matchesText = !q ||
        (m.title || "").toLowerCase().includes(q) ||
        (m.source || "").toLowerCase().includes(q) ||
        (m.summary || "").toLowerCase().includes(q);
      const matchesSent = sFilter === "all" || m.sentiment === sFilter;
      return matchesText && matchesSent;
    });

    items.sort((a, b) => {
      const da = new Date(a.date).getTime() || 0;
      const db = new Date(b.date).getTime() || 0;
      return sortDir === "newest" ? db - da : da - db;
    });

    if (!items.length) {
      els.grid.innerHTML = '<div class="empty">No mentions match your filters yet.</div>';
      return;
    }

    els.grid.innerHTML = items.map(m => {
      const fresh = isNew(m.date);
      const sent = ["positive", "neutral", "negative"].includes(m.sentiment) ? m.sentiment : "neutral";
      return `
      <article class="card ${fresh ? "new" : ""}">
        <div class="card-top">
          <h2><a href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.title)}</a></h2>
        </div>
        <div class="meta">${escapeHtml(m.source || "Unknown")} · ${fmtDate(m.date)}</div>
        <p class="summary">${escapeHtml(m.summary || "")}</p>
        <div class="badges">
          ${fresh ? '<span class="badge new">New</span>' : ""}
          <span class="badge s-${sent}">${sent}</span>
          <a class="readmore" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">Read source →</a>
        </div>
      </article>`;
    }).join("");
  }

  function renderStats() {
    const total = all.length;
    const pos = all.filter(m => m.sentiment === "positive").length;
    const neg = all.filter(m => m.sentiment === "negative").length;
    const fresh = all.filter(m => isNew(m.date)).length;
    els.stats.innerHTML = `
      <span class="pill"><b>${total}</b> total mentions</span>
      <span class="pill"><b>${fresh}</b> in last 24h</span>
      <span class="pill"><b>${pos}</b> positive</span>
      <span class="pill"><b>${neg}</b> negative</span>`;
  }

  ["input", "change"].forEach(ev => {
    els.search.addEventListener(ev, render);
    els.sentiment.addEventListener(ev, render);
    els.sort.addEventListener(ev, render);
  });

  (async function init() {
    try {
      all = await loadData();
      if (!Array.isArray(all)) all = [];
      els.loading.style.display = "none";
      const latest = all.reduce((max, m) => {
        const t = new Date(m.date).getTime() || 0;
        return t > max ? t : max;
      }, 0);
      els.updated.textContent = latest
        ? "Last mention: " + new Date(latest).toLocaleString()
        : "";
      renderStats();
      render();
    } catch (err) {
      els.loading.textContent =
        "Could not load mentions.json yet. Once the workflow runs, data will appear here.";
    }
  })();
</script>
</body>
</html>
